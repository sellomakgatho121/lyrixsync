name: NodeJS with Webpack

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies
      # Use 'npm ci' for faster, more reliable installs in CI environments
      run: npm ci

    # To enable, add a "lint" script to your package.json, e.g., "lint": "eslint ."
    # - name: Lint Code
    #   run: npm run lint

    # To enable, add a "test" script to your package.json
    # - name: Run Tests
    #   run: npm test

    - name: Build for Production
      # Use --mode=production to enable Webpack's built-in optimizations
      run: npx webpack --mode=production
